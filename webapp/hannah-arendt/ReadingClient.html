<script>
let readingRound=Number(document.body.dataset.initialRound)||0,readingMode='read',recordKindFilter='all';
let seminarForm=null,seminarDirty=false,seminarTimer=null,seminarPublishing=false;
function recordKindClient(d){return d?.kind||'movie';}
function recordKindName(d){return {movie:'영화 소감',discussion:'토의 후 나의 답',reflection:'활동 후 성찰'}[recordKindClient(d)]||'활동 기록';}
function labelsClient(d){return recordKindClient(d)==='movie'?S.labels:S.recordLabels[recordKindClient(d)];}
function recordKindTag(d){return `<span class="tag ${recordKindClient(d)==='reflection'?'pink':''}">${recordKindName(d)}${d?.round?' · 발제 '+d.round:''}</span>`;}
function recordExcerpt(d){return d?.learned||d?.questions?.[0]?.answer||d?.questions?.[0]?.question||d?.scene||d?.connection||d?.thinking||d?.future||'';}
function readingKindSelect(){return `<select id="kind-filter" aria-label="활동 유형"><option value="all">모든 활동</option>${['movie','discussion','reflection'].map(k=>`<option value="${k}" ${recordKindFilter===k?'selected':''}>${recordKindName({kind:k})}</option>`).join('')}</select>`;}
function seminarFor(n){return (S.seminars||[]).find(s=>s.number===Number(n));}
function seminarRange(d){return d?.startPage&&d?.endPage?d.startPage+'~'+d.endPage+'쪽':'담당 쪽수 입력 전';}
function readingCounts(n,kind){return S.entries.filter(e=>e.data.kind===kind&&Number(e.data.round)===n&&e.status==='submitted'&&(!isTeacher()||S.members.some(m=>m.email===e.email&&m.role==='student'))).length;}
function seminarTiles(admin=false){return `<div class="seminar-grid">${(S.seminars||[]).map(s=>{const d=s.publication||s.draft;return `<article class="record-card seminar-tile"><div class="row"><span class="tag blue">발제 ${s.number}</span><span class="tag ${s.publication?'green':''}">${s.publication?'자료 공유 중':s.assigned?'자료 준비 중':'담당자 미정'}</span></div><h2>${esc(d?.chapter||'『인간의 조건』 읽기')}</h2><p><b>${esc(s.ownerName||'발제자 지정 전')}</b><br>${esc(seminarRange(d))}${d?.activityDate?' · '+esc(d.activityDate):''}</p>${admin?`<p class="fine">토의 답변 제출 ${readingCounts(s.number,'discussion')}명 · 성찰 제출 ${readingCounts(s.number,'reflection')}명</p>`:''}<div class="button-row">${btn('reading-open','발제 '+s.number+' 열기',`data-round="${s.number}"`)}${s.assignedToMe?'<span class="fine">나의 담당 발제</span>':''}</div></article>`;}).join('')}</div>`;}
function mySeminarCards(){const mine=(S.seminars||[]).filter(s=>s.assignedToMe);if(!mine.length)return '';return `<section class="my-seminars"><h2>나의 발제 자료</h2><div class="record-grid">${mine.map(s=>`<article class="record-card"><span class="tag blue">발제 ${s.number}</span><h2>${esc(s.draft?.chapter||s.publication?.chapter||'발제 자료 준비하기')}</h2><p>${esc(seminarRange(s.draft))}</p>${btn('reading-open','발제 자료 열기',`data-round="${s.number}"`)}</article>`).join('')}</div></section>`;}
function readingAdminView(){return `<p class="info">발제별 담당자와 자료 준비 상태, 토의 답변·성찰 제출 현황을 확인합니다. 각 발제를 열어 담당 학생을 지정하고 자료를 확인할 수 있습니다.</p>${seminarTiles(true)}`;}
function readingView(){
 if(!readingRound)return heading('『인간의 조건』 발제와 토의','여덟 번의 발제를 통해 책을 읽고, 토의와 개인 성찰을 쌓아 갑니다.',btn('refresh',icon('refresh')+'새로고침'))+`<p class="info">발제자는 내용 요약과 질문을 준비합니다. 발제자를 포함한 모든 구성원은 토의 후 자신의 답과 성찰을 기록합니다.</p>${seminarTiles()}`;
 const s=seminarFor(readingRound);if(!s)return empty('발제를 찾지 못했습니다.','새로고침해 주세요.');
 if(readingMode==='edit'&&s.canEdit)return seminarEditor(s);
 const p=s.publication,d=p||s.draft;
 const controls=`<div class="button-row">${btn('reading-list','전체 발제')}${s.canEdit?btn('reading-edit','발제 자료 작성·수정',`data-round="${s.number}"`,'primary'):''}${s.canClaim?btn('reading-claim','이 발제 담당하기',`data-round="${s.number}"`):''}</div>`;
 let body=heading('발제 '+s.number,d?.chapter||'『인간의 조건』',controls)+`<section class="card"><div class="reading-meta"><div><span>발제자</span><b>${esc(s.ownerName||'담당자 미정')}</b></div><div><span>담당 범위</span><b>${esc(seminarRange(d))}</b></div><div><span>활동일</span><b>${esc(d?.activityDate||'입력 전')}</b></div></div></section>`;
 if(isTeacher()&&!s.assigned)body+=assignmentForm(s);
 if(!p)return body+empty('아직 발제 자료를 준비하고 있습니다.','담당 발제자가 내용 요약과 토의 질문을 공유하면 여기에서 함께 읽을 수 있습니다.');
 body+=`<section class="card"><div class="section-head"><span class="step">01</span><h2>내용 요약</h2></div><div class="reading-text">${esc(p.summary)}</div></section><section class="card"><div class="section-head"><span class="step">02</span><h2>함께 토의할 질문</h2></div>${p.questions.map((q,i)=>`<article class="reading-question"><h3>질문 ${i+1}</h3><p>${esc(q.question)}</p>${q.source?`<p class="fine">본문 근거 · ${esc(q.source)}</p>`:''}</article>`).join('')}</section><section class="card after-reading"><span class="micro">AFTER DISCUSSION</span><h2>토의를 마친 뒤, 나의 생각 남기기</h2><p>발제자도 함께 작성합니다. 저장한 기록은 본인과 교사가 확인하며, 교사가 선택한 제출 내용만 친구들에게 공유됩니다.</p><div class="after-actions"><div><h3>토의 후 나의 답</h3><p>각 토의 질문에 대한 나의 답과 근거를 씁니다.</p>${btn('reading-response','질문별 답 작성하기',`data-round="${s.number}"`,'primary')}</div><div><h3>활동 후 성찰 기록</h3><p>이번 활동에서 이해한 점과 생각의 변화, 남은 질문을 돌아봅니다.</p>${btn('reading-reflection','성찰 기록 작성하기',`data-round="${s.number}"`,'primary')}</div></div></section>`;
 return body;
}
function assignmentForm(s){const assigned=new Set((S.seminars||[]).map(x=>x.ownerEmail).filter(Boolean)),students=S.members.filter(m=>m.role==='student'&&m.status==='approved'&&!assigned.has(m.email));return `<section class="card"><h2>담당 학생 지정</h2><p>학생이 학교 계정으로 접속하고 구성원 승인을 받은 뒤 지정할 수 있습니다. 학생은 비어 있는 발제를 직접 선택할 수도 있습니다.</p><label class="field-label" for="seminar-owner">담당 학생</label><select id="seminar-owner"><option value="">학생 선택</option>${students.map(m=>`<option value="${esc(m.email)}">${esc(m.studentNo)} ${esc(m.name)}</option>`).join('')}</select><div class="modal-actions">${btn('reading-assign','담당 학생 지정',`data-round="${s.number}"`)}</div></section>`;}
function createSeminarForm(s){const data=deep(s.draft||{});data.questions=data.questions?.length?data.questions:[{id:uid(),question:'',source:''}];seminarForm={number:s.number,data};seminarDirty=false;saveMessage='작성하면 자동으로 저장됩니다.';}
function seminarEditor(s){
 if(!seminarForm||seminarForm.number!==s.number)createSeminarForm(s);
 const d=seminarForm.data;
 return heading('발제 '+s.number+' 자료 작성',s.ownerName?'발제자 · '+s.ownerName:'담당 학생을 지정하기 전에도 범위를 준비할 수 있습니다.',btn('reading-read','공유 화면 보기',`data-round="${s.number}"`))+`<p class="info"><strong>작성 중인 자료는 담당 발제자와 교사가 확인합니다.</strong> ‘발제 자료 공유’를 누르면 구성원에게 공개됩니다. 공유 후 수정한 초안은 다시 공유하기 전까지 공개되지 않습니다.</p><form id="seminar-form"><section class="card"><div class="field"><label for="seminar-chapter">담당 장·절<span class="required">*</span></label><input id="seminar-chapter" maxlength="200" value="${esc(d.chapter||'')}" placeholder="예: 제1장 인간의 조건 · 담당 절" required></div><div class="reading-inputs"><div class="field"><label for="seminar-start">시작 쪽수<span class="required">*</span></label><input id="seminar-start" type="number" min="1" max="999999" value="${esc(d.startPage||'')}" required></div><div class="field"><label for="seminar-end">끝 쪽수<span class="required">*</span></label><input id="seminar-end" type="number" min="1" max="999999" value="${esc(d.endPage||'')}" required></div><div class="field"><label for="seminar-date">활동일<span class="required">*</span></label><input id="seminar-date" type="date" value="${esc(d.activityDate||'')}" required></div></div></section><section class="card"><div class="section-head"><span class="step">01</span><h2>내용 요약</h2></div>${textarea('seminar-summary','핵심 주장과 개념을 자신의 말로 설명해 보세요.','아렌트는 무엇을 주장하며, 어떤 개념을 구별하나요? 담당 부분의 흐름과 중요한 대목을 정리합니다.',d.summary||'',10,12000)}</section><section class="card"><div class="section-head"><span class="step">02</span><h2>토의 질문</h2></div><p class="field-help">함께 논의할 질문을 만들고, 그 질문이 나온 본문의 대목이나 쪽수를 덧붙여 보세요.</p>${d.questions.map((q,i)=>`<div class="seminar-qa qa-item" data-question-id="${esc(q.id)}"><div class="qa-head"><b>토의 질문 ${i+1}</b>${i>0?btn('reading-remove-question','삭제',`data-index="${i}"`):''}</div><div class="field"><label for="sq-${i}">함께 토의할 질문<span class="required">*</span></label><textarea id="sq-${i}" data-seminar="question" maxlength="1500" rows="3" required>${esc(q.question)}</textarea></div><div class="field"><label for="ss-${i}">질문이 나온 본문·쪽수<span class="optional">선택</span></label><textarea id="ss-${i}" data-seminar="source" maxlength="1500" rows="2">${esc(q.source)}</textarea></div></div>`).join('')}<button type="button" class="add-question" data-action="reading-add-question" ${d.questions.length>=10?'disabled':''}>${icon('plus')}토의 질문 추가 (${d.questions.length}/10)</button></section><div class="save-bar"><span class="save-info"><span id="save-message" role="status">${esc(saveMessage)}</span></span><div class="button-row">${btn('reading-download','내려받기')}${btn('reading-save','초안 저장')}${btn('reading-publish','발제 자료 공유','','primary')}</div></div></form>${s.publication?`<div class="modal-actions">${btn('reading-unpublish','발제 자료 공유 해제',`data-round="${s.number}"`,'danger')}</div>`:''}`;
}
function captureSeminar(){if(!$('#seminar-form')||!seminarForm)return;const d=seminarForm.data;d.chapter=$('#seminar-chapter').value;d.startPage=$('#seminar-start').value;d.endPage=$('#seminar-end').value;d.activityDate=$('#seminar-date').value;d.summary=$('#seminar-summary').value;d.questions=Array.from(document.querySelectorAll('.seminar-qa')).map(n=>({id:n.dataset.questionId,question:n.querySelector('[data-seminar=question]').value,source:n.querySelector('[data-seminar=source]').value}));}
function markSeminarDirty(){captureSeminar();seminarDirty=true;clearTimeout(seminarTimer);updateSaveMessage('변경사항 저장 대기 중…');seminarTimer=setTimeout(()=>saveSeminar(false),1600);}
async function saveSeminar(publish=false){clearTimeout(seminarTimer);captureSeminar();if(!seminarForm||!approved())return false;if(!seminarDirty&&!publish)return true;const payload=deep(seminarForm),fingerprint=JSON.stringify(payload);const job=async()=>{try{updateSaveMessage('저장 중…');const s=seminarFor(payload.number);const r=await rpc({action:'seminarSave',...payload,revision:s?.revision||0,publish});S.seminars=r.seminars;if(seminarForm?.number===payload.number&&JSON.stringify(seminarForm)===fingerprint){seminarDirty=false;updateSaveMessage(publish?'발제 자료를 구성원에게 공유했습니다.':'모든 변경사항이 저장되었습니다.');}showError('');return true;}catch(e){showError(e.message);updateSaveMessage('저장하지 못했습니다. 입력 내용은 유지됩니다.');return false;}};const next=saveQueue.then(job,job);saveQueue=next;return next;}
async function flushSeminar(){clearTimeout(seminarTimer);if(seminarDirty&&!await saveSeminar(false))return false;return true;}
function captureReadingRecord(){if(form.data.kind==='reflection'){form.data.learned=$('#reflection-learned').value;form.data.thinking=$('#reflection-thinking').value;form.data.future=$('#reflection-future').value;}else{form.data.questions.forEach((q,i)=>{q.answer=$('#response-'+i).value;});}}
function readingRecordView(){const d=form.data,reflection=d.kind==='reflection';return heading(recordKindName(d)+' · 발제 '+d.round,d.topic||'『인간의 조건』',btn('reading-open','발제 자료로 돌아가기',`data-round="${d.round}"`))+`<p class="info"><strong>나의 활동 기록에 개인별로 누적됩니다.</strong> 저장 내용은 본인과 교사가 확인하며, 교사가 선택해 공유한 제출 항목만 다른 구성원에게 보입니다.${reflection?' 질문별 답변과 별도로, 활동 전체를 돌아보는 기록입니다.':' 작성할 때 읽은 발제의 질문을 기준으로 기록합니다.'}</p><form id="write-form"><section class="card"><div class="meta-grid"><div class="field"><label for="record-title">기록 제목</label><input id="record-title" maxlength="120" value="${esc(form.title)}" required></div><div class="field"><label for="activity-date">활동일</label><input id="activity-date" type="date" value="${esc(form.activityDate)}" required></div></div></section>${reflection?`<section class="card"><div class="section-head"><span class="step">01</span><h2>이번 활동에서 이해한 점</h2></div>${textarea('reflection-learned','무엇을 새롭게 이해했나요?','본문에서 이해한 개념이나 주장, 발제와 토의가 이해에 도움을 준 대목을 구체적으로 적습니다.',d.learned,5,6000)}</section><section class="card"><div class="section-head"><span class="step">02</span><h2>토의를 거치며 달라지거나 유지한 생각</h2></div>${textarea('reflection-thinking','어떤 의견이 내 생각에 영향을 주었나요?','내 생각이 어떻게 달라졌는지, 또는 어떤 근거로 기존 생각을 유지했는지 돌아봅니다. 발제자는 자료를 준비하고 토의한 과정도 함께 돌아보세요.',d.thinking,5,6000)}</section><section class="card"><div class="section-head"><span class="step">03</span><h2>더 탐구하고 싶은 질문</h2></div>${textarea('reflection-future','다음 독서와 토의로 가져갈 질문이 있나요?','아직 풀리지 않은 의문이나 다음 활동에서 더 알아보고 싶은 점을 간단히 적습니다.',d.future,3,3000,true)}</section>`:d.questions.map((q,i)=>`<section class="card"><div class="section-head"><span class="step">${String(i+1).padStart(2,'0')}</span><h2>${esc(q.question)}</h2></div>${q.source?`<p class="field-help">본문 근거 · ${esc(q.source)}</p>`:''}${textarea('response-'+i,'토의 후 나의 답','친구들의 의견을 듣고 난 지금, 이 질문에 대해 어떻게 생각하나요? 나의 답과 근거를 적습니다.',q.answer,6,5000)}</section>`).join('')}<div class="save-bar"><span class="save-info"><span id="save-message" role="status">${esc(saveMessage)}</span></span><div class="button-row">${btn('download-draft','내려받기')}${btn('save','저장')}${btn('submit','교사에게 제출','','primary')}</div></div></form>`;}
async function startReadingRecord(kind,n){if(!await flush())return;const existing=S.entries.find(e=>e.email===S.user.email&&e.data.kind===kind&&Number(e.data.round)===n);if(existing){await edit(existing.id);return;}const s=seminarFor(n),p=s?.publication;if(!p){showError('공유된 발제 자료를 확인해 주세요.');return;}const data={kind,round:n,seminarRevision:s.publishedRevision,topic:p.chapter+' · '+seminarRange(p)};if(kind==='reflection')Object.assign(data,{learned:'',thinking:'',future:''});else data.questions=p.questions.map(q=>({questionId:q.id,question:q.question,source:q.source,answer:''}));form={id:uid(),title:recordKindName(data)+' · 발제 '+n,activityDate:p.activityDate||today(),data};dirty=false;saveMessage='작성하면 자동으로 저장됩니다.';view='reading-record';render();window.scrollTo({top:0});}
async function readingAction(a,button){const n=Number(button.dataset.round)||readingRound;
 if(a==='reading-response'||a==='reading-reflection'){await startReadingRecord(a==='reading-response'?'discussion':'reflection',n);return;}
 if(a==='reading-open'||a==='reading-list'||a==='reading-read'||a==='reading-edit'){if(!await flush())return;readingRound=a==='reading-list'?0:n;readingMode=a==='reading-edit'?'edit':'read';view='reading';if(a==='reading-edit')createSeminarForm(seminarFor(n));render();window.scrollTo({top:0});return;}
 if(a==='reading-claim'){if(!await flush())return;if(await mutation({action:'seminarClaim',number:n},'담당 발제자로 등록했습니다.')){readingMode='edit';createSeminarForm(seminarFor(n));render();}return;}
 if(a==='reading-assign'){const email=$('#seminar-owner').value;if(!email){showError('담당 학생을 선택해 주세요.');return;}if(await mutation({action:'seminarAssign',number:n,email},'담당 학생을 지정했습니다.'))render();return;}
 if(a==='reading-add-question'){captureSeminar();if(seminarForm.data.questions.length>=10)return;seminarForm.data.questions.push({id:uid(),question:'',source:''});seminarDirty=true;render();$('#sq-'+(seminarForm.data.questions.length-1)).focus();clearTimeout(seminarTimer);seminarTimer=setTimeout(()=>saveSeminar(false),1600);return;}
 if(a==='reading-remove-question'){captureSeminar();const i=Number(button.dataset.index),q=seminarForm.data.questions[i];if(q&&(q.question||q.source)&&!confirm('이 토의 질문을 삭제할까요?'))return;seminarForm.data.questions.splice(i,1);seminarDirty=true;render();clearTimeout(seminarTimer);seminarTimer=setTimeout(()=>saveSeminar(false),1600);return;}
 if(a==='reading-download'){captureSeminar();download(seminarForm,'인간의조건_발제자료.json');return;}
 if(a==='reading-save'){if(await saveSeminar(false))notice('발제 초안을 저장했습니다.');return;}
 if(a==='reading-publish'){if(seminarPublishing||!$('#seminar-form').reportValidity())return;seminarPublishing=true;button.disabled=true;document.querySelectorAll('#seminar-form input,#seminar-form textarea').forEach(e=>e.readOnly=true);try{if(await saveSeminar(true)){readingMode='read';render();notice('발제 자료를 공유했습니다.');window.scrollTo({top:0});}}finally{seminarPublishing=false;document.querySelectorAll('#seminar-form input,#seminar-form textarea').forEach(e=>e.readOnly=false);if(button.isConnected)button.disabled=false;}return;}
 if(a==='reading-unpublish'){if(!await flush())return;if(await mutation({action:'seminarUnpublish',number:n},'발제 자료의 공유를 해제했습니다.')){readingMode='read';render();}}
}
</script>
